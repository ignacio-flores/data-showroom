#define data source
data.file: "data/taxw_kf3_ready.qs"
keep.col:
  - "geo"

#define plot type
gopts: "point"

scatter_options:
  enabled: true
  show_labels: true
  label_mode: "auto"
  label_max_all: 18
  label_max_auto: 20
  label_size: 12
  x_scale_selector: true

#define main plot variables
axis_vars:
  x_axis:
    var: "total_revenue_from_tax_as_percent_of_total_tax_revenue"
    choices: c("top_marginal_rate", "exemption_threshold", "total_revenue_from_tax", "total_revenue_from_tax_as_percent_of_total_tax_revenue", "total_revenue_from_tax_as_percent_of_gross_domestic_product")
    alt.names: c("Top Marginal Rates", "Exemption Thresholds (millions, selected currency)", "Tax Revenue (millions, selected currency)", "Tax Revenue % Total Tax Revenue", "Tax Revenue % GDP")
    label: "X Axis"
    breaks: 10
  y_axis:
    var: "top_marginal_rate"
    choices: c("top_marginal_rate", "exemption_threshold", "total_revenue_from_tax", "total_revenue_from_tax_as_percent_of_total_tax_revenue", "total_revenue_from_tax_as_percent_of_gross_domestic_product")
    alt.names: c("Top Marginal Rates", "Exemption Thresholds (millions, selected currency)", "Tax Revenue (millions, selected currency)", "Tax Revenue % Total Tax Revenue", "Tax Revenue % GDP")
    label: "Y Axis"

color:
  var: "geo_long"
  label: "Country"
  style: "dichromat::DarkRedtoBlue_12"
  group:
    - "geo_long"

#Define main selector
fixed_selectors:
  year:
    label: "Year"
    selected: 2022
  tax_type_view:
    label: "Type of tax"
    selected: "Inheritance or estate tax"
    choices:
      - "Inheritance or estate tax"
      - "Inheritance tax"
      - "Estate tax"
      - "Gift tax"
    visible_when: { any: { x_axis: ["top_marginal_rate", "exemption_threshold"], y_axis: ["top_marginal_rate", "exemption_threshold"] } }
  revenue_tax_category:
    label: "Revenue category"
    selected: "Estate, inheritance and gift taxes (EIG)"
    choices:
      - "Estate, inheritance and gift taxes (EIG)"
      - "Gift tax"
    visible_when: { any: { x_axis: ["total_revenue_from_tax", "total_revenue_from_tax_as_percent_of_total_tax_revenue", "total_revenue_from_tax_as_percent_of_gross_domestic_product"], y_axis: ["total_revenue_from_tax", "total_revenue_from_tax_as_percent_of_total_tax_revenue", "total_revenue_from_tax_as_percent_of_gross_domestic_product"] } }
  xrate_lab:
    label: "Currency & Price Adjustment"
    selected: "Euro adjusting for inflation"
    choices:
      - "National Currency"
      - "National Currency adjusting for inflation"
      - "USD"
      - "USD adjusting for inflation"
      - "Euro"
      - "Euro adjusting for inflation"
      - "Yuan"
      - "Yuan adjusting for inflation"
      - "PPP USD"
      - "PPP Euro"
      - "PPP Yuan"

loose_selectors:
  geo_long:
    label: "Country"
    type: "sticky checkbox"


#define the columns of the data table widget
dt.cols:
  geo_long: "Country"
  year: "Year"
  tax_type_view: "Type of tax"
  revenue_tax_category: "Revenue category"
  xrate_lab: "Currency & price adjustment"
  top_marginal_rate: "Top Marginal Rates"
  exemption_threshold: "Exemption Thresholds (millions, selected currency)"
  total_revenue_from_tax: "Tax Revenue (millions, selected currency)"
  total_revenue_from_tax_as_percent_of_total_tax_revenue: "Tax Revenue % Total Tax Revenue"
  total_revenue_from_tax_as_percent_of_gross_domestic_product: "Tax Revenue % GDP"

#define the information shown in the tooltip
tooltip_vars:
  geo_long: "Country:"
  year: "Year:"
  tax_type_view: "Type of tax:"
  revenue_tax_category: "Revenue category:"
  xrate_lab: "Currency & price adjustment:"
  top_marginal_rate: "Top Marginal Rates:"
  exemption_threshold: "Exemption Thresholds (millions, selected currency):"
  total_revenue_from_tax: "Tax Revenue (millions, selected currency):"
  total_revenue_from_tax_as_percent_of_total_tax_revenue: "Tax Revenue % Total Tax Revenue:"
  total_revenue_from_tax_as_percent_of_gross_domestic_product: "Tax Revenue % GDP:"

download.cols:
  - "d2_sector"
  - "d2_sector_lab"
  - "tax_type"
  - "kinship"
  - "revenue_d2_sector"
  - "revenue_d2_sector_lab"

#other options
download.button: True
hide.selectors: False
listen: False
table.display: True
hide.legend: True
plot_height: 700
